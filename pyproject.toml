[project]
name = "plotpoint-tools"
version = "0.1.0"
description = "Quality and packaging scripts for the plotpoint skills repo (not a published package)"
requires-python = ">=3.11"
license = "Apache-2.0"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [".venv", "node_modules", "dist", ".claude/worktrees"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade, S bandit
select = ["E", "W", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests: assert is the point (S101); subprocess calls run our own scripts (S603, S607).
"tests/*" = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
