id: r5
question: "How long do visitors wait for help?"
data: {path: data/wait_minutes.csv}
source: "Branch visit survey, individual visits"
as_of: 2026-09-30
targets: [md/document, html/document]
out_dir: figures/r5
intent:
  visual_type: histogram
  rationale: "How values are spread out across 300 individual visits: histogram"
  headline: "Half of visitors get help within 7.8 minutes, but the longest wait was 47.5 minutes"
  headline_status: draft
  fields: {value: wait_min, names: {wait_min: "Wait (minutes)"}}
  callouts:
    - {kind: rule, x: 7.8, text: "Median 7.8 min"}
    - {kind: note, text: "Longest single wait: 47.5 min"}
  outlier_handling: {method: accept, reason: "The 10 IQR outliers are the real right tail of a skewed wait distribution; the histogram shows them as the tail"}
