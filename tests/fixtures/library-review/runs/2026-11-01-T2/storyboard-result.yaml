# Storyboard result for "City library services review, FY26" (mode B: datasets, no draft)
visuals:
  - id: v1
    questions: [q1]
    datasets: [loans_print, loans_ebook]
    audience: [board, managers]
    placement: summary
    intent:
      visual_type: line
      rationale: "Change over time across five quarters; two series on the same quarters and units, the story is about the renovation dip and e-book recovery"
      headline: "Total loans fell 18% during the renovation; e-book loans have since recovered and grown"
      headline_status: confirmed
      fields:
        x: quarter
        y: [print, ebook]
        names: {quarter: Quarter, print: Print, ebook: E-book}
      highlight: [ebook]
      callouts:
        - {kind: rule, x: "Q2 '26", text: "Q2 renovation\nTotal 1,230 → 1,008 (−18%)"}
        - {kind: point, x: "Q3 '26", series: ebook, text: "E-book 445, a five-quarter high"}
      outlier_handling:
        method: accept
        reason: "print is flagged 'skewed' only because five quarters split into a high pre-renovation group and a low post-renovation group; that step is the story, no IQR outliers"
      units: Loans (thousands)
    renderings:
      md/document:
        technique: svg
        compensations: []
      html/document:
        technique: svg
  - id: v2
    questions: [q2]
    datasets: [members]
    audience: [board]
    placement: summary
    intent:
      visual_type: number
      rationale: "The question asks for one count; a stat tile with the change answers it faster than a chart"
      headline: "48,210 people are active members, up 3.2% from 46,700"
      headline_status: draft
      fields:
        value: value
        label: metric
        previous: previous
      outlier_handling: {method: none_flagged}
    renderings:
      md/document:
        technique: text
      html/document:
        technique: svg
        compensations: ["Stat tile; the comparison period for 'previous' must be named in the label or source line once the caller confirms it"]
  - id: v3
    questions: [q3]
    datasets: [branch_waits]
    audience: [managers]
    placement: body
    intent:
      visual_type: scatter
      rationale: "Staffing need is a relationship between two measures (staff vs wait) across 12 branches; a scatter shows Riverside sitting apart from branches with similar FTE"
      headline: "Riverside's average wait is far above every other branch at similar staffing"
      headline_status: confirmed
      fields:
        x: staff_fte
        y: avg_wait_min
        label: branch
        names: {staff_fte: "Staff (FTE)", avg_wait_min: "Average wait (minutes)", branch: Branch}
      highlight: [Riverside]
      callouts:
        - {kind: point, x: Riverside, text: "Riverside: 48 min at 4.5 FTE"}
        - {kind: point, x: Eastgate, text: "Eastgate: 15 min at 4.5 FTE"}
        - {kind: note, text: "Central (24 FTE, 6 min) is plotted at the far right; all other branches have 4.5–9 FTE"}
      outlier_handling:
        method: callout
        reason: "Riverside's 48-minute wait is the flagged outlier and the story (highlighted and labeled). Central's 24 FTE is also flagged; it is real and kept on a linear axis, with a note, so the 4.5–9 FTE cluster stays readable in the caller's review"
      units: Average wait (minutes)
    renderings:
      md/document:
        technique: svg
        compensations: []
      html/document:
        technique: svg
  - id: v4
    questions: [q4]
    datasets: [wait_minutes]
    audience: [managers]
    placement: body
    intent:
      visual_type: histogram
      rationale: "The question is about how waits are spread across 300 visits; a histogram shows the typical wait and the long tail"
      headline: "The median visit waits 7.8 minutes, and 82% of visitors are helped within 15 minutes"
      headline_status: draft
      fields:
        value: wait_min
        names: {wait_min: "Wait (minutes)"}
      callouts:
        - {kind: note, text: "Median 7.8 min; 82% of 300 surveyed visits under 15 min; longest 47.5 min"}
      outlier_handling:
        method: accept
        reason: "The 10 IQR outliers (27–47.5 min) are the real right tail of a wait-time distribution; drawn as-is and the longest wait is named in the note"
      units: Visits
    renderings:
      md/document:
        technique: svg
        compensations: []
      html/document:
        technique: svg
  - id: v5
    questions: [q3]
    datasets: [branch_overview]
    audience: [managers]
    placement: appendix
    intent:
      visual_type: table
      rationale: "Four measures across 12 branches with no single takeaway: reference detail for managers, best as a table"
      headline: "Branch operations at a glance: visits, opening hours, staff and events for all 12 branches"
      headline_status: draft
      fields:
        columns: [branch, visits_k, open_hours, staff_fte, events]
        sort: data
        names: {branch: Branch, visits_k: "Visits (thousands)", open_hours: "Open hours / week", staff_fte: "Staff (FTE)", events: Events}
      highlight: [Riverside]
      outlier_handling:
        method: accept
        reason: "Central is the flagged outlier in all four columns; a table shows exact values, so nothing is flattened"
    renderings:
      md/document:
        technique: table
      html/document:
        technique: table
recommendations:
  - kind: order
    detail: "Lead with v1 (q1, the renovation question, for both audiences), then v2 (active members) in the summary. In the body, v3 (staffing, which carries a decision) comes before v4 (overall wait distribution)."
    affects: [v1, v2, v3, v4]
  - kind: merge
    detail: "Print and e-book loans share quarters and units and tell one story; draw them as one line chart. For rendering, provide one combined dataset with columns quarter, print, ebook (data/derived/loans_by_quarter.csv already has this shape). The −18% total is not plotted, so it is carried by the Q2 rule callout (1,230 → 1,008)."
    affects: [v1]
  - kind: cut
    detail: "Café revenue does not measure how many people use the library, so it doesn't answer q2. Cut it from q2; if the caller wants it, it would only fit as appendix context for q1 (June is its lowest month), and that is the caller's call."
    affects: [cafe_sales]
  - kind: demote
    detail: "branch_overview has four measures across 12 branches and no single takeaway: show it as an appendix table (v5) rather than a chart."
    affects: [v5]
  - kind: placement
    detail: "q3 and q4 are for managers only, so v3 and v4 sit in the body and v5 in the appendix. If the board is asked to approve staffing, consider adding a one-sentence summary of v3 for them; that is the caller's decision."
    affects: [v3, v4, v5]
  - kind: other
    detail: "Check the q1 takeaway against the data before confirming: e-book loans did reach a new high (445), but print kept falling after the renovation (598 → 590), so total loans in Q3 '26 (1,035) are still below Q1 '26 (1,230). The headline is unchanged; the caller may want the prose to say whether total use has recovered."
    affects: [v1]
  - kind: other
    detail: "For q3, 'at similar staffing' holds (Eastgate also has 4.5 FTE at 15 min), but branch_overview shows Riverside with 96k visits vs Eastgate's 38k at the same FTE. The caller may want to compare waits against visits per FTE before concluding which branches need staff; no conclusion is drawn here."
    affects: [v3, v5]
  - kind: other
    detail: "v2's draft headline compares to 'previous' (46,700), but the dataset doesn't say which period that is. Confirm the period (e.g. FY25) so the tile can name it."
    affects: [v2]
color_map:
  E-book: accent
  Print: context
  Riverside: accent
